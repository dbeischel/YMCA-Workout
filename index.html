<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YMCA Workout">
<title>YMCA Strength + Golf</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--green:#16a34a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:5;margin:0 -14px 14px;padding:calc(18px + env(safe-area-inset-top)) 18px 16px;background:#111827;color:#fff;border-radius:0 0 18px 18px}
h1{margin:0 0 4px;font-size:24px}.sub{font-size:13px;color:#d1d5db;margin-bottom:12px}
.progress{display:flex;gap:10px;align-items:center}.bar{flex:1;height:10px;background:#374151;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#22c55e}
.week{font-size:12px;color:#d1d5db;margin-top:9px}.count{font-size:12px;color:var(--muted)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.nav button{border:0;border-radius:11px;padding:10px 4px;background:#fff;font-weight:800}.nav button.active{background:var(--blue);color:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)} .hidden{display:none}
.head{display:flex;justify-content:space-between;gap:10px}.focus{font-size:13px;color:var(--muted);margin:4px 0 10px}.badge{display:inline-block;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.row{display:grid;grid-template-columns:30px 1fr 82px;gap:8px;align-items:center;padding:11px 0;border-top:1px solid var(--line)} .row.first{border-top:0}
.check{width:23px;height:23px;accent-color:var(--green)} .name{font-weight:700;font-size:15px}.reps{font-size:12px;color:var(--muted);margin-top:2px}
.done{opacity:.65}.done .name{text-decoration:line-through}.entry{width:82px;padding:8px 6px;border:1px solid #d1d5db;border-radius:9px;text-align:center}
.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;margin-top:5px}.complete{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.actions{display:flex;gap:9px;margin:14px 0}.actions button{flex:1;border:0;border-radius:12px;padding:13px 10px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#e5e7eb}
.tip{background:#eef2ff;border-radius:13px;padding:12px 13px;font-size:13px;line-height:1.45}.small{text-align:center;font-size:11px;color:var(--muted);margin-top:13px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>YMCA Strength + Golf</h1>
  <div class="sub">Overall strength first • golf-friendly accessories</div>
  <div class="progress"><div class="bar"><div class="fill" id="fill"></div></div><div id="overall">0 / 0</div></div>
  <div class="week" id="week"></div>
</header>

<div class="nav" id="nav"></div>
<div id="app"></div>

<div class="actions">
  <button class="primary" id="next">Next Exercise</button>
  <button class="secondary" id="reset">New Week</button>
</div>

<div class="tip"><b>Busy YMCA rule:</b> machine occupied? Do another exercise from that day and circle back.</div>
<div class="small">Checkmarks and weights save automatically on this device.</div>
</div>

<script>
const workouts=[
{name:"Lower A",day:"Monday",focus:"Strength + posterior chain + core",ex:[
["Bike Warm-up","8–10 min","time"],["Leg Press","3 × 8–10","weight"],["Seated Hamstring Curl","3 × 10–12","weight"],["Leg Extension","3 × 10–12","weight"],["Single-Leg Leg Press","2 × 10 / leg","weight"],["Calf Raise","3 × 12–15","weight"],["Back Extension","2 × 10–12","weight"],["Pallof Press","2 × 10 / side","weight"]]},
{name:"Upper A",day:"Wednesday",focus:"Balanced upper-body strength",ex:[
["Bike Warm-up","8–10 min","time"],["Chest Press Machine","3 × 8–10","weight"],["Lat Pulldown","3 × 8–10","weight"],["Seated Row","3 × 8–10","weight"],["Shoulder Press Machine","3 × 8–10","weight"],["Pec Deck / Chest Fly","2 × 10–12","weight"],["Triceps Pressdown","2 × 10–12","weight"],["Biceps Curl","2 × 10–12","weight"]]},
{name:"Lower B",day:"Friday",focus:"Strength + unilateral work + golf rotation",ex:[
["Bike Warm-up","8–10 min","time"],["Leg Press","3 × 10–12","weight"],["Seated Hamstring Curl","3 × 8–10","weight"],["Single-Leg Leg Press","3 × 8–10 / leg","weight"],["Leg Extension","2 × 12","weight"],["Calf Raise","3 × 15","weight"],["Back Extension","2 × 12–15","weight"],["Cable Woodchop","2 × 10 / side","weight"]]},
{name:"Upper B",day:"Saturday",focus:"Back emphasis + shoulders/arms + golf accessory",ex:[
["Bike Warm-up","8–10 min","time"],["Seated Row","3 × 10–12","weight"],["Incline Chest Press Machine","3 × 8–10","weight"],["Lat Pulldown","3 × 10–12","weight"],["Reverse Fly / Rear Delt Machine","3 × 12–15","weight"],["Shoulder Press Machine","2 × 10","weight"],["Triceps Pressdown","2 × 12","weight"],["Biceps Curl","2 × 12","weight"],["Cable Rotation or Pallof Press","2 × 10 / side","weight"]]}
];

const KEY="ymcaWorkoutState_v1"; let selected=0;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
let state=load();
if(!state._init){[0,1,2,3,5,6].forEach(i=>state["c_0_"+i]=true);state._init=true;save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function monday(){const d=new Date(),day=d.getDay(),diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return d}
function render(){
 document.getElementById("week").textContent="Week of "+monday().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
 const nav=document.getElementById("nav"); nav.innerHTML="";
 workouts.forEach((w,di)=>{const b=document.createElement("button");b.textContent=w.name;b.className=di===selected?"active":"";b.onclick=()=>{selected=di;render()};nav.appendChild(b)});
 const host=document.getElementById("app"); host.innerHTML="";
 const w=workouts[selected]; const card=document.createElement("section"); card.className="card";
 const done=w.ex.filter((_,ei)=>state["c_"+selected+"_"+ei]).length;
 card.innerHTML='<div class="head"><div><h2 style="margin:0">'+w.name+'</h2><div class="focus">'+w.focus+'</div><span class="badge">'+w.day.toUpperCase()+'</span></div><div class="count">'+done+'/'+w.ex.length+' done</div></div><div id="list"></div><div class="footer"><label class="complete"><input class="check" id="daycheck" type="checkbox" '+(done===w.ex.length?'checked':'')+'> Workout Complete</label><span class="count">'+(done===w.ex.length?'✓ Finished':'')+'</span></div>';
 host.appendChild(card);
 const list=document.getElementById("list");
 w.ex.forEach((ex,ei)=>{const checked=!!state["c_"+selected+"_"+ei];const row=document.createElement("div");row.className="row "+(ei===0?"first ":"")+(checked?"done":"");row.dataset.i=ei;
 row.innerHTML='<input class="check excheck" type="checkbox" '+(checked?'checked':'')+'><div><div class="name">'+ex[0]+'</div><div class="reps">'+ex[1]+'</div></div><input class="entry" type="text" inputmode="decimal" placeholder="'+ex[2]+'" value="'+(state["w_"+selected+"_"+ei]||"")+'">';
 row.querySelector(".excheck").onchange=e=>{state["c_"+selected+"_"+ei]=e.target.checked;save();render()};
 row.querySelector(".entry").oninput=e=>{state["w_"+selected+"_"+ei]=e.target.value;save()};
 list.appendChild(row)});
 document.getElementById("daycheck").onchange=e=>{w.ex.forEach((_,ei)=>state["c_"+selected+"_"+ei]=e.target.checked);save();render()};
 let total=0,allDone=0;workouts.forEach((ww,di)=>ww.ex.forEach((_,ei)=>{total++;if(state["c_"+di+"_"+ei])allDone++}));
 document.getElementById("overall").textContent=allDone+" / "+total;document.getElementById("fill").style.width=(allDone/total*100)+"%";
}
document.getElementById("next").onclick=()=>{const rows=[...document.querySelectorAll(".row")];const r=rows.find(x=>!x.querySelector(".excheck").checked);if(r)r.scrollIntoView({behavior:"smooth",block:"center"});else alert("This workout is complete.")};
document.getElementById("reset").onclick=()=>{if(confirm("Clear this week's checkmarks? Saved weights will stay.")){Object.keys(state).forEach(k=>{if(k.startsWith("c_"))delete state[k]});save();render()}};
render();
</script>
</body>
</html>
